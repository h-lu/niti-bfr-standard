[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niti-bfr-standard"
version = "0.1.0"
description = "Minimal software scheme for NiTi bend-free-recovery testing"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  "pandas",
  "matplotlib",
  "pyyaml",
  "scikit-image",
  "skan",
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
